name: 刷步数

on:
  # 支持手动触发
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: '手动触发执行'
        required: false
        default: 'true'
  

  # 高频触发窗口（每10分钟，UTC时间）
  schedule:
    - cron: '*/10 1-2 * * *'    # BJ 9:00-10:59，morning 触发窗口（9点/10点二选一）
    - cron: '*/10 11-12 * * *'  # BJ 19:00-20:59，evening 触发窗口（19点/20点二选一）

# 串行执行，避免并发运行争抢任务状态与Token缓存
concurrency:
  group: zepp-step-run
  cancel-in-progress: false

jobs:
  # 轻量守门任务：不检出代码、不安装依赖，纯 bash 判断北京时间，约10秒结束
  # 作用：平台cron触发时间不准时，由这里按北京时间精确放行，
  #       窗口外的触发不会走到主任务（省去 checkout + pip install 的分钟数消耗）
  time-gate:
    runs-on: ubuntu-latest
    outputs:
      should_run: ${{ steps.check.outputs.should_run }}
    steps:
    - name: 北京时间窗口检查
      id: check
      run: |
        # 手动触发直接放行
        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          echo "[放行] 手动触发，跳过时间窗口检查"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
          exit 0
        fi

        BJ_TIME=$(TZ=Asia/Shanghai date '+%F %T')
        BJ_HOUR=$((10#$(TZ=Asia/Shanghai date +%H)))
        echo "[信息] 平台时间: $(date -u '+%F %T') UTC"
        echo "[信息] 北京时间: $BJ_TIME (hour=$BJ_HOUR)"

        # 允许窗口（北京时间）: 9点、10点、19点、20点
        if [ "$BJ_HOUR" -eq 9 ] || [ "$BJ_HOUR" -eq 10 ] || [ "$BJ_HOUR" -eq 19 ] || [ "$BJ_HOUR" -eq 20 ]; then
          echo "[放行] 当前处于执行窗口（北京 9/10/19/20 点），允许执行主任务"
          echo "should_run=true" >> "$GITHUB_OUTPUT"
        else
          echo "[跳过] 不在执行窗口内，本次触发到此为止"
          echo "should_run=false" >> "$GITHUB_OUTPUT"
        fi

  run-script:
    # 仅当守门任务放行时才执行
    needs: time-gate
    if: needs.time-gate.outputs.should_run == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v5  
      with:
        python-version: '3.10'
        cache: 'pip'  # 启用pip缓存加速
    
    # 从上一次成功的 workflow run 下载 Token 缓存
    - name: 下载Token缓存
      uses: dawidd6/action-download-artifact@v3
      with:
        workflow: run.yml
        name: encrypted-tokens
        path: artifact-download
        search_artifacts: true
        allow_forks: true
      continue-on-error: true

    - name: 恢复缓存文件
      run: |
        # 恢复 Token 缓存
        if [ -f "artifact-download/encrypted_tokens.data" ]; then
          cp artifact-download/encrypted_tokens.data ./encrypted_tokens.data
          echo "[成功] Token缓存已恢复"
        elif [ -f "artifact-download/encrypted-tokens/encrypted_tokens.data" ]; then
          cp artifact-download/encrypted-tokens/encrypted_tokens.data ./encrypted_tokens.data
          echo "[成功] Token缓存已恢复（从子目录）"
        else
          echo "[信息] 无Token缓存文件，将创建新文件"
        fi
        # 恢复任务状态文件（用于每日去重）
        if [ -f "artifact-download/task_state.json" ]; then
          cp artifact-download/task_state.json ./task_state.json
          echo "[成功] 任务状态已恢复"
        elif [ -f "artifact-download/encrypted-tokens/task_state.json" ]; then
          cp artifact-download/encrypted-tokens/task_state.json ./task_state.json
          echo "[成功] 任务状态已恢复（从子目录）"
        else
          echo "[信息] 无任务状态文件，将创建新文件"
        fi
      
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # 显示环境信息（调试用）
    - name: 显示环境信息
      run: |
        echo "Python版本: $(python --version)"
        echo "当前时间: $(date)"
        echo "时区: $(date +%Z)"
        ls -la
        
    - name: 执行刷步数脚本
      env:
        ZEPP_USER: ${{ secrets.ZEPP_USER }}                    # Zepp账号（必需）
        ZEPP_PWD: ${{ secrets.ZEPP_PWD }}                      # Zepp密码（必需）
        AES_KEY: ${{ secrets.AES_KEY }}                        # AES加密密钥（必需，16字节）
        SCKEY: ${{ secrets.SCKEY }}                            # Server酱推送密钥（可选）
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}        # PushPlus推送token（可选）
        PUSH_WECHAT_WEBHOOK_KEY: ${{ secrets.PUSH_WECHAT_WEBHOOK_KEY }}  # 企业微信Webhook Key（可选）
      run: |
        python main.py
        
    # 保存缓存文件（用于下次运行）
    - name: 上传缓存文件
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: encrypted-tokens
        path: |
          encrypted_tokens.data
          task_state.json
        retention-days: 7                            #保存天数
        if-no-files-found: ignore
        
