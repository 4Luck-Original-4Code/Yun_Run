name: 刷步数

on:
  # 支持手动触发
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: '手动触发执行'
        required: false
        default: 'true'
  
  # 每天自动运行2次（UTC时间）
  schedule:
    # UTC 1:00（北京 9:00）- 不推送通知
    - cron: '0 1 * * *'
    # UTC 11:00（北京 19:00）- 推送通知
    - cron: '0 11 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v5  
      with:
        python-version: '3.10'
        cache: 'pip'  # 启用pip缓存加速
    
    # 下载之前保存的 Token 缓存（如果存在）
    - name: 下载Token缓存
      uses: actions/download-artifact@v4
      with:
        name: encrypted-tokens
        path: .
      continue-on-error: true
      
    # 下载cron时间记录（用于推送时间判断）
    - name: 下载Cron时间记录
      uses: actions/download-artifact@v4
      with:
        name: cron-change-time
        path: .
      continue-on-error: true
        
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # 显示环境信息（调试用）
    - name: 显示环境信息
      run: |
        echo "Python版本: $(python --version)"
        echo "当前时间: $(date)"
        echo "时区: $(date +%Z)"
        ls -la
        
    # 记录计划执行时间（用于推送时间判断）
    - name: 记录计划执行时间
      run: |
        # 获取北京时间的小时数
        beijing_hour=$(TZ=Asia/Shanghai date '+%-H')
        beijing_minute=$(TZ=Asia/Shanghai date '+%M')
        
        # 写入cron_change_time文件
        echo "planned exec time: 北京时间(${beijing_hour}:${beijing_minute})" > cron_change_time
        echo "actual exec time: $(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" >> cron_change_time
        
        # 显示内容
        cat cron_change_time
        
    - name: 执行刷步数脚本
      env:
        ZEPP_USER: ${{ secrets.ZEPP_USER }}                    # Zepp账号（必需）
        ZEPP_PWD: ${{ secrets.ZEPP_PWD }}                      # Zepp密码（必需）
        AES_KEY: ${{ secrets.AES_KEY }}                        # AES加密密钥（必需，16字节）
        SCKEY: ${{ secrets.SCKEY }}                            # Server酱推送密钥（可选）
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}        # PushPlus推送token（可选）
        PUSH_PLUS_HOUR: ${{ secrets.PUSH_PLUS_HOUR }}          # PushPlus推送整点时间0-23（可选）
        PUSH_WECHAT_WEBHOOK_KEY: ${{ secrets.PUSH_WECHAT_WEBHOOK_KEY }}  # 企业微信Webhook Key（可选）
      run: |
        python main.py
        
    # 保存Token缓存（用于下次运行）
    - name: 上传Token缓存
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: encrypted-tokens
        path: encrypted_tokens.data
        retention-days: 7                            #保存天数
        if-no-files-found: ignore
        
    # 保存计划执行时间（用于推送时间判断）
    - name: 上传Cron时间记录
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: cron-change-time
        path: cron_change_time
        retention-days: 7
        if-no-files-found: ignore
