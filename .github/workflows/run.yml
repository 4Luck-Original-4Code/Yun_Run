name: 刷步数

on:
  # 支持手动触发
  workflow_dispatch:
    inputs:
      manual_trigger:
        description: '手动触发执行'
        required: false
        default: 'true'
  
  # 每天自动运行2次（UTC时间）
  schedule:
    # UTC 1:00（北京 9:00）- 不推送通知
    - cron: '0 1 * * *'
    # UTC 11:00（北京 19:00）- 推送通知
    - cron: '0 11 * * *'

jobs:
  run-script:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
      
    steps:
    - name: 检出代码
      uses: actions/checkout@v4
      
    - name: 设置Python环境
      uses: actions/setup-python@v5  
      with:
        python-version: '3.10'
        cache: 'pip'  # 启用pip缓存加速
    
    # 从上一次成功的 workflow run 下载 Token 缓存
    - name: 下载Token缓存
      uses: dawidd6/action-download-artifact@v3
      with:
        workflow: run.yml
        name: encrypted-tokens
        path: artifact-download
        search_artifacts: true
        allow_forks: true
      continue-on-error: true

    - name: 恢复Token缓存文件
      run: |
        if [ -f "artifact-download/encrypted_tokens.data" ]; then
          cp artifact-download/encrypted_tokens.data ./encrypted_tokens.data
          echo "[成功] Token缓存已恢复"
        elif [ -f "artifact-download/encrypted-tokens/encrypted_tokens.data" ]; then
          cp artifact-download/encrypted-tokens/encrypted_tokens.data ./encrypted_tokens.data
          echo "[成功] Token缓存已恢复（从子目录）"
        else
          echo "[信息] 无Token缓存文件，将创建新文件"
        fi
      
    - name: 安装依赖
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
    
    # 显示环境信息（调试用）
    - name: 显示环境信息
      run: |
        echo "Python版本: $(python --version)"
        echo "当前时间: $(date)"
        echo "时区: $(date +%Z)"
        ls -la
        
    - name: 执行刷步数脚本
      env:
        ZEPP_USER: ${{ secrets.ZEPP_USER }}                    # Zepp账号（必需）
        ZEPP_PWD: ${{ secrets.ZEPP_PWD }}                      # Zepp密码（必需）
        AES_KEY: ${{ secrets.AES_KEY }}                        # AES加密密钥（必需，16字节）
        SCKEY: ${{ secrets.SCKEY }}                            # Server酱推送密钥（可选）
        PUSH_PLUS_TOKEN: ${{ secrets.PUSH_PLUS_TOKEN }}        # PushPlus推送token（可选）
        PUSH_PLUS_HOUR: ${{ secrets.PUSH_PLUS_HOUR }}          # PushPlus推送整点时间0-23（可选）
        PUSH_WECHAT_WEBHOOK_KEY: ${{ secrets.PUSH_WECHAT_WEBHOOK_KEY }}  # 企业微信Webhook Key（可选）
        SCHEDULED_CRON: ${{ github.event.schedule || '' }}     # 本次触发的cron表达式（用于判断是否推送）
      run: |
        python main.py
        
    # 保存Token缓存（用于下次运行）
    - name: 上传Token缓存
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: encrypted-tokens
        path: encrypted_tokens.data
        retention-days: 7                            #保存天数
        if-no-files-found: ignore
        

